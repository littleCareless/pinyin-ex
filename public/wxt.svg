<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" stroke="#FFF" stroke-width="4" />

  <!-- 中心汉字 -->
  <path d="M45 45 L45 83 M45 45 L65 45 M45 64 L55 64 M55 45 L55 83" stroke="#FFF" stroke-width="6"
    stroke-linecap="round" />

  <!-- 拼音波浪元素 -->
  <path d="M80 55 Q85 45 90 55 T100 55 T110 55 T120 55" stroke="#FFF" stroke-width="3" fill="none" />

  <!-- 声调符号 -->
  <g transform="translate(75 75)">
    <circle cx="0" cy="0" r="5" fill="#FFD700" />
    <path d="M-5 0 L5 0 M0 -5 L0 5" stroke="#FFF" stroke-width="2" />
  </g>
</svg>